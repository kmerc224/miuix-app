# .github/workflows/build.yml
name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]  # 推送到主分支时触发
  pull_request:
    branches: [ "main", "master" ]  # 向主分支发起PR时触发
  workflow_dispatch:                # 支持在GitHub网页上手动触发[reference:4]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest          # 使用最新的Ubuntu环境[reference:5][reference:6]
    timeout-minutes: 60             # 设置超时时间，防止任务卡住[reference:7]

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4    # 官方checkout action[reference:8][reference:9]

      # 2. 设置Java环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4  # 官方setup-java action[reference:10]
        with:
          distribution: 'temurin'    # Java发行版[reference:11]
          java-version: '17'         # 根据项目调整，常见为11或17[reference:12][reference:13]

      # 3. 设置Gradle并启用缓存 (核心优化步骤)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4 # 官方setup-gradle action[reference:14][reference:15]
        # 此action会自动处理Gradle Wrapper并缓存依赖，大幅加速构建[reference:16][reference:17]

      # 4. 赋予gradlew执行权限 (如果需要)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 执行Gradle构建 (生成Debug APK)
      - name: Build debug APK
        run: ./gradlew assembleDebug   # 构建Debug包[reference:18][reference:19]

      # 6. 上传APK作为构建产物 (Artifact)
      - name: Upload APK
        uses: actions/upload-artifact@v4 # 官方upload-artifact action[reference:20][reference:21]
        with:
          name: app-debug-apk          # 产物名称
          path: app/build/outputs/apk/debug/*.apk # APK文件路径[reference:22]